name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Wiki CLI
        run: pip install wazootech-wiki==0.7.0

      - name: Validate all templates
        run: bash scripts/validate-all.sh

  deno:
    # The template's TypeScript is shipped payload: this job only checks it,
    # it never rewrites it. No lockfile ships with the template (a scaffolded
    # site generates its own), so the check cannot run --frozen.
    name: Template fmt, lint, typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/wikipedia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: deno fmt --check
      - run: deno lint
      - run: deno check build.ts
