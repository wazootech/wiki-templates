name: Deploy Wiki to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wiki CLI
        # Pinned to the version the wiki-templates root workflow uses; bumps are deliberate.
        run: pip install wazootech-wiki==0.1.23

      - name: Integrity audits
        run: wiki -c wiki.yml check --strict -v

      - name: Convention audits
        run: wiki -c wiki.yml lint --strict -v

      - name: Build static site
        run: wiki -c wiki.yml build --output-dir _site --site-base-url /

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
