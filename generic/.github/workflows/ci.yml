# Canonical template workflow.
#
# This file is the reference for the four wiki gates every template must pass.
# The root README ("Templates must pass all four wiki gates") points here, and
# scripts/validate-all.sh runs the same four commands across the monorepo.
# Keep it in sync when the gate list changes; copy it into your own project as-is.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wiki:
    name: Validate wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wiki CLI
        # Pinned to the version the wiki-templates root workflow uses; bumps are deliberate.
        run: pip install wazootech-wiki==0.1.23

      - name: Check formatting
        run: wiki -c wiki.yml fmt --check

      - name: Check wiki integrity
        run: wiki -c wiki.yml check --strict -v

      - name: Lint wiki conventions
        run: wiki -c wiki.yml lint --strict -v

      - name: Check rendered SPARQL blocks
        run: wiki -c wiki.yml render --check -v
