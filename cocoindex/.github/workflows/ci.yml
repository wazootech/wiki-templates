name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wiki:
    name: Validate wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The explicit pin wins over the unpinned wazootech-wiki in requirements.txt:
        # pinned to the version the wiki-templates root workflow uses; bumps are deliberate.
        run: pip install -r requirements.txt "wazootech-wiki==0.1.23"

      - name: Check formatting
        run: wiki -c wiki.yml fmt --check

      - name: Check wiki integrity
        run: wiki -c wiki.yml check --strict -v

      - name: Lint wiki conventions
        run: wiki -c wiki.yml lint --strict -v

      - name: Check rendered SPARQL blocks
        run: wiki -c wiki.yml render --check -v

      - name: Build manifest
        run: python scripts/build_manifest.py

      - name: Test helpers
        run: python -m pytest

  pglite:
    name: PGlite fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Explicit pin; bumps are deliberate (matches the wiki-templates root workflow).
        run: |
          pip install -r requirements.txt "wazootech-wiki==0.1.23"
          pip install -r requirements-pglite.txt

      - name: Build manifest
        run: python scripts/build_manifest.py

      - name: Load index via PGlite
        run: python scripts/load_index.py

      - name: Query index via PGlite
        run: python scripts/query_index.py "incremental context"
