name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wiki:
    name: Validate wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wiki CLI
        # Pinned to the version the wiki-templates root workflow uses; bumps are deliberate.
        run: pip install wazootech-wiki==0.1.23

      - name: Check formatting
        run: wiki -c docs/wiki.yml fmt --check

      - name: Check wiki integrity
        run: wiki -c docs/wiki.yml check --strict -v

      - name: Lint wiki conventions
        run: wiki -c docs/wiki.yml lint --strict -v

      - name: Check rendered SPARQL blocks
        run: wiki -c docs/wiki.yml render --check -v

      - name: Build static site
        run: wiki -c docs/wiki.yml build --output-dir _site --site-base-url /workspace-cli

  compose-demo:
    name: Composition smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wiki CLI
        # Pinned to the version the wiki-templates root workflow uses; bumps are deliberate.
        run: pip install wazootech-wiki==0.1.23

      - name: Run compose demo
        run: bash scripts/compose-demo.sh
